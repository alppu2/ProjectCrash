server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Relabel regexes are fully anchored, so the .* on both sides is load
      # bearing: order-service has no container_name (see docker-compose.yml),
      # so compose names its replicas <project>-order-service-<n>.
      - source_labels: [__meta_docker_container_name]
        regex: /.*(order-service|inventory-service|chat-service).*
        action: keep
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: container
        replacement: $1
