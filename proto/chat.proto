syntax = "proto3";

package chat.v1;
option go_package = "./chat";

service ChatService {
  // One request, many responses: the server pushes ChatChunk frames until Done.
  rpc Chat(ChatRequest) returns (stream ChatChunk);
  // Readies the provider before the first turn. Cheap to repeat: the server
  // shares one in-flight call and reuses a recent success.
  rpc Warmup(WarmupRequest) returns (WarmupResponse);
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_USER = 1;
  ROLE_ASSISTANT = 2;
}

message Message {
  Role role = 1;
  string content = 2;
  // Set on assistant turns from Done.signature. The server drops assistant
  // turns whose signature does not verify.
  bytes signature = 3;
}

message ChatRequest {
  // Full conversation history. The last entry is the new user turn.
  repeated Message messages = 1;
}

message ChatChunk {
  oneof event {
    string text_delta = 1;  // append to the in-progress assistant message
    Done done = 2;          // terminal frame
  }
}

message Done {
  string stop_reason = 1;
  int32 input_tokens = 2;
  int32 output_tokens = 3;
  bytes signature = 4;  // HMAC over this reply and the question it answered
}

// Empty for now; room for e.g. a model id without a new RPC.
message WarmupRequest {}
message WarmupResponse {}
