services:
  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: order-service
    env_file:
      - order-service/.env
    networks:
      - micro-network
    depends_on:
      mongodb:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: ./order-service
        - action: rebuild
          path: ./orders

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    container_name: inventory-service
    env_file:
      - inventory-service/.env
    networks:
      - micro-network
    depends_on:
      rabbitmq:
        condition: service_healthy

  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    networks:
      - micro-network
    volumes:
      - mongo-data:/data/db

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - micro-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  envoy:
    image: envoyproxy/envoy:v1.25-latest
    container_name: envoy-proxy
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml
    ports:
      - "8080:8080"
    networks:
      - micro-network
    depends_on:
      - order-service

networks:
  micro-network:
    driver: bridge

volumes:
  mongo-data:
