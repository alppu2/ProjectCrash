global:
  scrape_interval: 15s

scrape_configs:
  - job_name: order-service
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: /.*order-service.*
        action: keep
      - source_labels: [__address__]
        regex: (.+):\d+
        replacement: $1:9091
        target_label: __address__
      - source_labels: [__meta_docker_container_name]
        target_label: instance

  - job_name: inventory-service
    static_configs:
      - targets: ['inventory-service:9091']

  - job_name: chat-service
    static_configs:
      - targets: ['chat-service:9091']

  - job_name: rabbitmq
    static_configs:
      - targets: ['rabbitmq:15692']

  # Qdrant serves /metrics at the default path. A static target is correct for
  # the same reason chat-service uses one: it has a container_name and is not
  # scaled.
  - job_name: qdrant
    static_configs:
      - targets: ['qdrant:6333']
